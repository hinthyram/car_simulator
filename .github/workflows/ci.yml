name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          find js shared server -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify package
        run: node -e "const p=require('./package.json'); console.log(p.name, p.version)"
